name: Preview links

on:
  deployment_status:

jobs:
  comment:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Wait for Vercel to finish updating its comment
        run: sleep 10

      - name: Append preview links to Vercel bot comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = context.payload.deployment_status.target_url;
            const sha = context.payload.deployment.sha;

            // Find the open PR for this SHA
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.find(p => p.head.sha === sha);
            if (!pr) return;

            // Find the vercel[bot] comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const vercelComment = comments.find(c => c.user.login === 'vercel[bot]');
            if (!vercelComment) return;

            const SEPARATOR = '\n\n---\n\n';
            const MARKER = '- [Preview (visitor login)]';

            // Strip previously appended section so we don't accumulate duplicates
            let base = vercelComment.body;
            const markerIdx = base.indexOf(SEPARATOR + MARKER);
            if (markerIdx !== -1) base = base.slice(0, markerIdx);

            const appended = `${base}${SEPARATOR}- [Preview (visitor login)](${url}/)\n- [Preview (organizer login)](${url}/organizer)`;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: vercelComment.id,
              body: appended,
            });
